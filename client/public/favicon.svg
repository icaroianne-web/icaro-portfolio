<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1623"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099FF"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% Full Edge Rounded Box (Zero Padding) -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Large Bold Monogram IA filling the box -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Syne', 'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="340" text-anchor="middle" dominant-baseline="central">
    <!-- Letter i (lowercase/uppercase style in Cyan) -->
    <text x="165" y="270" fill="url(#cyanGrad)" letter-spacing="-10">i</text>
    <!-- Letter A (White) -->
    <text x="335" y="270" fill="#F0F4FF" letter-spacing="-10">A</text>
  </g>

  <!-- Cyan Glow Accent Line at bottom edge -->
  <rect x="120" y="468" width="272" height="12" rx="6" fill="#00D4FF" filter="url(#glowEffect)"/>
</svg>
